name: "Keepalived HA Failover"
version: "0.1.3"
slug: "keepalived_failover"
description: "Gestione failover VRRP tra due nodi Home Assistant"
url: "https://github.com/mirkoa82/ha-keepalived-failover"
arch:
  - aarch64
  - armv7
  - amd64

init: false
startup: services
boot: auto
host_network: true

options:
  node_role: "backup"
  virtual_ip: "10.14.0.250"
  master_node_ip: "10.14.0.237"
  backup_node_ip: "10.14.0.245"
  interface: "eth0"
  vrid: 51
  vrrp_password: "cambiare123"

schema:
  node_role: "list(master|backup)"
  virtual_ip: "str"
  master_node_ip: "str"
  backup_node_ip: "str"
  interface: "str"
  vrid: "int(1,255)"
  vrrp_password: "str"
