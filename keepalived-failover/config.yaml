name: "HA Keepalived Failover"
version: "1.2.0"
slug: "keepalived-failover"
description: "Failover automatico Home Assistant sul Raspberry di backup"
url: "https://github.com/mirkoa82/ha-keepalived-failover"

arch:
  - aarch64
  - armv7
  - amd64

init: false
startup: services
boot: auto

# Accesso alla Supervisor API.
hassio_api: true
hassio_role: manager

# Necessario per controlli rete, gestione VIP e gratuitous ARP.
host_network: true

privileged:
  - NET_ADMIN
  - NET_RAW

options:
  # IP fisso del nodo master: viene verificato con ping e TCP 8123.
  master_node_ip: "10.14.0.237"

  # IP virtuale che appartiene al master in condizioni normali
  # e al Raspberry solo durante il failover.
  virtual_ip: "10.14.0.246"
  prefix_length: 24

  # auto = interfaccia IPv4 associata alla route default.
  # Puoi forzare, ad esempio, "end0" solo in una rete particolare.
  interface: "auto"

  # false = solo eventi, transizioni e errori; nessun log ad ogni sondaggio.
  # true = log dettagliati per debug.
  debug_logging: false

  check_interval: 5
  ping_timeout: 2
  tcp_timeout: 3

  failover_failures: 6
  failover_grace_period: 30

  failback_successes: 24
  failback_grace_period: 30

  core_start_timeout: 300
  core_stop_timeout: 120

  post_vip_add_delay: 3
  post_vip_remove_delay: 3

  # true: prova add/rimozione VIP e termina, senza gestire Core/master.
  test_vip_only: false
  vip_test_duration: 10

schema:
  master_node_ip: str
  virtual_ip: str
  prefix_length: int(1,32)
  interface: str
  debug_logging: bool

  check_interval: int(1,60)
  ping_timeout: int(1,15)
  tcp_timeout: int(1,30)

  failover_failures: int(1,120)
  failover_grace_period: int(0,900)

  failback_successes: int(1,360)
  failback_grace_period: int(0,1800)

  core_start_timeout: int(15,900)
  core_stop_timeout: int(15,600)

  post_vip_add_delay: int(0,60)
  post_vip_remove_delay: int(0,60)

  test_vip_only: bool
  vip_test_duration: int(1,120)
